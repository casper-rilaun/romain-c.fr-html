<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .bg { fill: #0b0b0f; }
      .txt { fill: #ffffff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-weight: 700; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f6f7fb; }
